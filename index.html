<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthFlow Pulse: Diagnóstico de Processos</title>
    <!-- Carrega Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carrega React e ReactDOM via CDN (versão development para depuração) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Carrega Babel para transpilar JSX no navegador (apenas para desenvolvimento/demonstração de arquivo único) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        // Expondo Firebase para o escopo global para que o Babel possa acessá-lo
        window.firebase = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, addDoc, doc, setDoc, getDoc };
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Cor de fundo suave */
        }
        /* Paleta Brilliant Blues: #003f5c, #7a5195, #ef5675, #ffa600, #374c80, #bc5090, #ff764a */
        .text-primary { color: #003f5c; }
        .bg-primary { background-color: #003f5c; }
        .text-accent-1 { color: #7a5195; }
        .bg-accent-1 { background-color: #7a5195; }
        .text-accent-2 { color: #ef5675; }
        .bg-accent-2 { background-color: #ef5675; }
        .text-highlight { color: #ffa600; }
        .bg-highlight { background-color: #ffa600; }
        .text-secondary { color: #374c80; }
        .bg-secondary { background-color: #374c80; }
        .text-accent-3 { color: #bc5090; }
        .bg-accent-3 { background-color: #bc5090; }
        .text-accent-4 { color: #ff764a; }
        .bg-accent-4 { background-color: #ff764a; }

        /* Estilos para cards de opção */
        .option-card {
            @apply flex flex-col items-center justify-center p-6 bg-white rounded-xl shadow-md transition-all duration-300 cursor-pointer border-2 border-transparent;
        }
        .option-card:hover {
            @apply shadow-lg transform scale-105 border-accent-1;
        }
        .option-card.selected {
            @apply border-accent-1 bg-accent-1 text-white shadow-xl transform scale-105;
        }
        .option-card.selected .icon {
            @apply text-highlight;
        }
        .option-card .icon {
            @apply text-5xl mb-3 text-accent-1 transition-colors duration-300;
        }
        .option-card.selected .text-content {
            @apply text-white;
        }
        .option-card .text-content {
            @apply text-center text-lg font-medium text-primary transition-colors duration-300;
        }

        /* Animação de fade-in */
        .fade-enter {
            opacity: 0;
        }
        .fade-enter-active {
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
        .fade-exit {
            opacity: 1;
        }
        .fade-exit-active {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* Estilo para simular IA pensando */
        .loading-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30px;
        }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #7a5195;
            border-radius: 50%;
            margin: 0 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        // Variáveis globais fornecidas pelo ambiente Canvas
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- DADOS DAS PERGUNTAS E LÓGICA ---
        // Aqui definimos todas as perguntas do formulário. A lógica de ramificação é crucial.
        // A chave `nextStep` em cada pergunta pode ser uma função para lógica complexa ou uma string para o próximo ID.
        // `pathKey` é usado para agrupar perguntas por caminho principal (A, B, C, etc.).
        const questionsData = {
            'welcome': {
                id: 'welcome',
                type: 'welcome',
                title: 'Bem-vindo(a) ao seu Diagnóstico Aprofundado HealthFlow PRO!',
                message: 'Em **15 minutos**, vamos desvendar os mistérios dos seus processos e identificar oportunidades de eficiência. Sua jornada começa agora.',
                cta: 'Começar Diagnóstico',
                nextStep: 'info_inicial',
            },
            'info_inicial': {
                id: 'info_inicial',
                type: 'text_select_split', // Um tipo customizado para função + tipo de instituição
                question: 'Para começarmos, qual a sua função na instituição e o tipo de instituição de saúde que você representa?',
                inputs: [
                    { id: 'funcao', label: 'Sua Função:', type: 'text', placeholder: 'Ex: Gerente Administrativo' },
                    { id: 'instituicao_tipo', label: 'Tipo de Instituição:', type: 'select', options: [
                        { value: 'clinica_imagem', label: 'Clínica de Diagnóstico por Imagem' },
                        { value: 'hosp_pequeno', label: 'Hospital Privado (Pequeno: até 50 leitos)' },
                        { value: 'hosp_medio', label: 'Hospital Privado (Médio: 51-200 leitos)' },
                        { value: 'hosp_grande', label: 'Hospital Privado (Grande: mais de 200 leitos)' },
                        { value: 'clinica_especializada', label: 'Clínica Especializada' },
                        { value: 'laboratorio', label: 'Laboratório de Análises Clínicas' },
                        { value: 'outro_tipo', label: 'Outro' },
                    ]}
                ],
                feedback: (responses) => `Ótimo, ${responses.funcao} de ${responses.instituicao_tipo}! Sua perspectiva é valiosa. Estamos prontos para iniciar a imersão.`,
                nextStep: 'gargalo_critico',
                pathIndicator: { step: 1, total: 4, label: 'Fase 1: Contexto Inicial' }
            },
            'gargalo_critico': {
                id: 'gargalo_critico',
                type: 'choice_cards',
                question: 'Para iniciarmos nossa investigação, qual é o gargalo mais CRÍTICO que está gerando mais dor de cabeça e prejuízo na sua operação HOJE?',
                options: [
                    { value: 'agendamento', label: 'Agendamento & No-Shows Destrutivos', icon: '🗓️' },
                    { value: 'faturamento', label: 'Faturamento & Glosas que Drenam o Caixa', icon: '💸' },
                    { value: 'fluxo_pacientes', label: 'Fluxo de Pacientes Lento & Quebras de Atendimento', icon: '🚶‍♀️' },
                    { value: 'laudos', label: 'Laudos & Resultados Crônica e Atrasados', icon: '⏰' },
                    { value: 'equipe_resistente', label: 'Equipe Resistente a Novas Tecnologias ou Novas Rotinas', icon: '🛡️' },
                    { value: 'estoque', label: 'Gestão de Estoque & Insumos Ineficiente', icon: '📦' },
                    { value: 'outro_gargalo', label: 'Outro', icon: '❓' },
                ],
                feedback: (responses, selectedOption) => `Excelente foco. Este é o epicentro da nossa análise. A partir de agora, o RapidMapper PRO vai desvendar as camadas desse desafio.`,
                nextStep: (responses) => {
                    const selectedGargalo = responses.gargalo_critico;
                    if (selectedGargalo === 'agendamento') return 'agendamento_canais'; // Caminho A
                    if (selectedGargalo === 'faturamento') return 'faturamento_volume_mensal'; // Caminho B
                    if (selectedGargalo === 'fluxo_pacientes') return 'pacientes_percurso_as_is'; // Caminho C
                    if (selectedGargalo === 'laudos') return 'laudos_etapas_principais'; // Caminho D
                    if (selectedGargalo === 'equipe_resistente') return 'equipe_tipo_resistencia'; // Caminho E
                    if (selectedGargalo === 'estoque') return 'estoque_fluxo_insumo_as_is'; // Caminho F
                    if (selectedGargalo === 'outro_gargalo') return 'outro_gargalo_detalhe'; // Caminho G
                    return 'welcome'; // Fallback para o início se algo der errado
                },
                pathIndicator: { step: 1, total: 4, label: 'Fase 1: Contexto Inicial' }
            },

            // --- CAMINHO A: AGENDAMENTO & NO-SHOWS DESTRUTIVOS ---
            'agendamento_canais': {
                id: 'agendamento_canais',
                pathKey: 'agendamento',
                type: 'multiple_choice_buttons',
                question: 'Sua equipe realmente domina o processo de agendamento? Em quais canais ele se torna um pesadelo?',
                options: [
                    { value: 'telefone', label: 'Telefone' },
                    { value: 'whatsapp_atendente', label: 'WhatsApp (com atendente)' },
                    { value: 'whatsapp_chatbot', label: 'WhatsApp (chatbot)' },
                    { value: 'app_proprio', label: 'Aplicativo Próprio' },
                    { value: 'site_formulario', label: 'Site (Formulário)' },
                    { value: 'presencialmente', label: 'Presencialmente' },
                    { value: 'indicacao_medica', label: 'Indicação Médica (direta)' },
                    { value: 'outros_canais', label: 'Outros' },
                ],
                feedback: 'Entendido. A origem do problema muitas vezes começa na entrada.',
                nextStep: 'agendamento_sistema_principal',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_sistema_principal': {
                id: 'agendamento_sistema_principal',
                pathKey: 'agendamento',
                type: 'multiple_choice_buttons',
                question: 'Qual sistema REALMENTE dita o ritmo do seu agendamento? (Seja sincero: ERP, planilha, ou uma mistura de caos?)',
                options: [
                    { value: 'tasy', label: 'Tasy' },
                    { value: 'mv', label: 'MV' },
                    { value: 'pixeon', label: 'Pixeon' },
                    { value: 'outro_erp', label: 'Outro ERP de Saúde' },
                    { value: 'sistema_proprio', label: 'Sistema Próprio' },
                    { value: 'planilha_excel', label: 'Planilha de Excel' },
                    { value: 'papel_manual', label: 'Papel/Manual' },
                    { value: 'nenhum', label: 'Nenhum' },
                ],
                nextStep: (responses) => {
                    const sys = responses.agendamento_sistema_principal;
                    if (['tasy', 'mv', 'pixeon', 'outro_erp'].includes(sys)) return 'agendamento_falha_erp';
                    if (['sistema_proprio', 'planilha_excel', 'papel_manual', 'nenhum'].includes(sys)) return 'agendamento_passo_critico_manual';
                    return 'agendamento_percentual_remarcacoes'; // Fallback se nenhuma condição for atendida (não deveria acontecer)
                },
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_falha_erp': {
                id: 'agendamento_falha_erp',
                pathKey: 'agendamento',
                type: 'textarea_input',
                question: 'Seu ERP [@answer_to_question_agendamento_sistema_principal] é uma solução ou um obstáculo no agendamento? Qual a MAIOR falha dele que te frustra diariamente?',
                inputProps: { type: 'textarea', placeholder: 'Ex: Lentidão, erros de sincronização, relatórios incompletos', maxLength: 500 },
                nextStep: 'agendamento_percentual_remarcacoes',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_passo_critico_manual': {
                id: 'agendamento_passo_critico_manual',
                pathKey: 'agendamento',
                type: 'textarea_input',
                question: 'Descreva o \'passo a passo\' mais crítico do seu agendamento. Onde a bola mais CAI no chão?',
                inputProps: { type: 'textarea', placeholder: 'Ex: Paciente liga -> Atendente agenda em planilha -> Confirmação manual', maxLength: 500 },
                nextStep: 'agendamento_percentual_remarcacoes',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_percentual_remarcacoes': {
                id: 'agendamento_percentual_remarcacoes',
                pathKey: 'agendamento',
                type: 'opinion_scale',
                question: 'Sem rodeios: Qual a % de remarcações ou faltas (no-shows) que você sabe que perde por MÊS? (Isso é dinheiro voando!)',
                options: [
                    { value: '0-5', label: '0-5%' }, { value: '6-10', label: '6-10%' },
                    { value: '11-15', label: '11-15%' }, { value: '16-20', label: '16-20%' },
                    { value: '>20', label: 'Acima de 20%' },
                ],
                nextStep: 'agendamento_confirmacao',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_confirmacao': {
                id: 'agendamento_confirmacao',
                pathKey: 'agendamento',
                type: 'multiple_choice_buttons',
                question: 'Como vocês \'tentam\' confirmar os agendamentos? Isso realmente funciona?',
                options: [
                    { value: 'automatica', label: 'Sim, automática (SMS/WhatsApp/E-mail)' },
                    { value: 'manual', label: 'Sim, manual (telefonema pela equipe)' },
                    { value: 'misto', label: 'Misto (parte manual, parte automática)' },
                    { value: 'nao_fazemos', label: 'Não fazemos' },
                ],
                nextStep: 'agendamento_ticket_medio',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_ticket_medio': {
                id: 'agendamento_ticket_medio',
                pathKey: 'agendamento',
                type: 'text_input', // Usando text_input para número, para maior flexibilidade e placeholder
                question: 'Qual o valor médio (ticket médio) de um procedimento/consulta que é REMARCADO ou FALTANDO? (Para calcularmos sua perda real)',
                inputProps: { type: 'number', placeholder: 'Ex: 150.00', min: 0 },
                feedback: 'Seu RapidMapper está calculando o custo EXATO desse gargalo. Prepare-se para o número!',
                nextStep: 'agendamento_visibilidade_sistema',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_visibilidade_sistema': {
                id: 'agendamento_visibilidade_sistema',
                pathKey: 'agendamento',
                type: 'multiple_choice_buttons',
                question: 'Seu sistema atual dá visibilidade que PRECISA sobre agendamentos e no-shows?',
                options: [
                    { value: 'sim_totalmente', label: 'Sim, totalmente' },
                    { value: 'sim_lacunas', label: 'Sim, mas com lacunas' },
                    { value: 'nao_buraco_negro', label: 'Não, é um \'buraco negro\'' },
                    { value: 'nao_temos_sistema', label: 'Não temos sistema' },
                ],
                nextStep: 'agendamento_mudanca_perfeito',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'agendamento_mudanca_perfeito': {
                id: 'agendamento_mudanca_perfeito',
                pathKey: 'agendamento',
                type: 'textarea_input',
                question: 'Imagine o agendamento PERFEITO. Qual seria a principal mudança que você faria para chegar lá HOJE, se não houvesse barreiras?',
                inputProps: { type: 'textarea', placeholder: 'Descreva sua visão (máx. 500 caracteres)', maxLength: 500 },
                feedback: 'Seu input é ouro. Estamos mapeando a rota para a sua eficiência máxima.',
                nextStep: 'ai_mini_report', // Fim do Caminho A, vai para o Mini-Relatório da IA
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },

            // --- CAMINHO B: FATURAMENTO & GLOSAS QUE DRENAM O CAIXA ---
            'faturamento_volume_mensal': {
                id: 'faturamento_volume_mensal',
                pathKey: 'faturamento',
                type: 'opinion_scale', // Usando opinion_scale para representar escala de volume
                question: 'Qual o volume médio de faturamento mensal que sua instituição GERA? (Para dimensionarmos o impacto)',
                options: [
                    { value: 'ate_500k', label: 'Até R$500 mil' },
                    { value: '500k_2m', label: 'R$500 mil - R$2 milhões' },
                    { value: '2m_5m', label: 'R$2 milhões - R$5 milhões' },
                    { value: 'acima_5m', label: 'Acima de R$5 milhões' },
                ],
                nextStep: 'faturamento_sistema_principal',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_sistema_principal': {
                id: 'faturamento_sistema_principal',
                pathKey: 'faturamento',
                type: 'multiple_choice_buttons',
                question: 'Qual sistema principal sua equipe usa para faturar e controlar o dinheiro que ENTRA e SAI?',
                options: [
                    { value: 'tasy', label: 'Tasy' },
                    { value: 'mv', label: 'MV' },
                    { value: 'pixeon', label: 'Pixeon' },
                    { value: 'outro_erp', label: 'Outro ERP de Saúde' },
                    { value: 'sistema_proprio', label: 'Sistema Próprio' },
                    { value: 'planilha_excel', label: 'Planilha de Excel' },
                    { value: 'papel_manual', label: 'Papel/Manual' },
                    { value: 'nenhum', label: 'Nenhum' },
                ],
                nextStep: (responses) => {
                    const sys = responses.faturamento_sistema_principal;
                    if (['tasy', 'mv', 'pixeon', 'outro_erp'].includes(sys)) return 'faturamento_falha_erp';
                    if (['sistema_proprio', 'planilha_excel', 'papel_manual', 'nenhum'].includes(sys)) return 'faturamento_etapa_obscura_manual';
                    return 'faturamento_percentual_glosas'; // Fallback
                },
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_falha_erp': {
                id: 'faturamento_falha_erp',
                pathKey: 'faturamento',
                type: 'textarea_input',
                question: 'Qual o ponto mais CRÍTICO do seu sistema [@answer_to_question_faturamento_sistema_principal] que GERA glosas ou retrabalho?',
                inputProps: { type: 'textarea', placeholder: 'Ex: Lentidão, dificuldade de auditoria, falhas de integração', maxLength: 500 },
                nextStep: 'faturamento_percentual_glosas',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_etapa_obscura_manual': {
                id: 'faturamento_etapa_obscura_manual',
                pathKey: 'faturamento',
                type: 'textarea_input',
                question: 'Descreva a etapa mais \'obscura\' ou propensa a erros no seu ciclo de faturamento. Onde o dinheiro está ESCAPANDO?',
                inputProps: { type: 'textarea', placeholder: 'Ex: Erros na transcrição manual de dados, falta de conferência', maxLength: 500 },
                nextStep: 'faturamento_percentual_glosas',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_percentual_glosas': {
                id: 'faturamento_percentual_glosas',
                pathKey: 'faturamento',
                type: 'opinion_scale',
                question: 'Seja direto: Qual a % de glosas que sua instituição ACUMULA por mês? (Isso é receita perdida!)',
                options: [
                    { value: '0-2', label: '0-2%' }, { value: '3-5', label: '3-5%' },
                    { value: '6-10', label: '6-10%' }, { value: '11-15', label: '11-15%' },
                    { value: '>15', label: 'Mais de 15%' },
                ],
                nextStep: 'faturamento_erros_comuns_glosas',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_erros_comuns_glosas': {
                id: 'faturamento_erros_comuns_glosas',
                pathKey: 'faturamento',
                type: 'multiple_choice_buttons',
                question: 'Quais os 3 erros MAIS COMUNS que causam essas glosas e roubam sua receita? (Priorize)',
                options: [
                    { value: 'inconsistencia_cadastro', label: 'Inconsistência de Cadastro' },
                    { value: 'erro_convenio', label: 'Erro Convênio' },
                    { value: 'falta_documentacao', label: 'Falta Documentação' },
                    { value: 'atraso_envio', label: 'Atraso Envio' },
                    { value: 'erro_codificacao', label: 'Erro Codificação' },
                    { value: 'recusa_procedimento', label: 'Recusa Procedimento' },
                    { value: 'duplicidade', label: 'Duplicidade' },
                    { value: 'outros_erros', label: 'Outros' },
                ],
                maxSelections: 3,
                nextStep: 'faturamento_tempo_retrabalho',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_tempo_retrabalho': {
                id: 'faturamento_tempo_retrabalho',
                pathKey: 'faturamento',
                type: 'opinion_scale',
                question: 'Quanto tempo sua equipe GASTA, por semana, CORRIGINDO glosas e retrabalhos de faturamento?',
                options: [
                    { value: '<4h', label: '< 4h' }, { value: '4-8h', label: '4-8h' },
                    { value: '8-16h', label: '8-16h' }, { value: '16-30h', label: '16-30h' },
                    { value: '>30h', label: '> 30h' },
                ],
                feedback: 'O RapidMapper está destrinchando o custo da sua ineficiência. Os números não mentem!',
                nextStep: 'faturamento_visibilidade_sistema',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_visibilidade_sistema': {
                id: 'faturamento_visibilidade_sistema',
                pathKey: 'faturamento',
                type: 'multiple_choice_buttons',
                question: 'Seu sistema atual dá visibilidade CLARA sobre o porquê das glosas e como evitá-las?',
                options: [
                    { value: 'sim_totalmente', label: 'Sim, totalmente' },
                    { value: 'sim_lacunas', label: 'Sim, mas com falhas' },
                    { value: 'nao_caixa_preta', label: 'Não, é uma \'caixa preta\'' },
                    { value: 'nao_temos_sistema', label: 'Não temos sistema' },
                ],
                nextStep: 'faturamento_eliminar_erro_ganho',
                pathIndicator: { step: 2, total: 4, label: 'Fase 2: Diagnóstico Aprofundado' }
            },
            'faturamento_eliminar_erro_ganho': {
                id: 'faturamento_eliminar_erro_ganho',

        // --- COMPONENTES REACT ---

        // Componente para exibir mensagens de alerta customizadas

        // Componente para a barra de progresso
        const ProgressBar = ({ currentStep, totalSteps, currentPhaseLabel, phaseStep, totalPhaseSteps }) => {

        // Componente para perguntas com input de texto e select
        const TextSelectSplitQuestion = ({ question, onAnswer, responses, showAlert }) => {

            const handleChange = (id, value) => {
                setLocalResponses(prev => ({ ...prev, [id]: value }));
            };

            const handleSubmit = () => {
                if (!localResponses[question.inputs[0].id] || !localResponses[question.inputs[1].id]) {
                    showAlert('Por favor, preencha todos os campos.');
                    return;
                }
                onAnswer(question.id, localResponses);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary mb-6">{question.question}</h2>
                    {question.inputs.map(input => (
                        <div key={input.id} className="mb-6">
                            <label htmlFor={input.id} className="block text-gray-700 text-lg font-medium mb-2">{input.label}</label>
                            {input.type === 'text' && (
                                <input
                                    type="text"
                                    id={input.id}
                                    value={localResponses[input.id] || ''}
                                    onChange={(e) => handleChange(input.id, e.target.value)}

                                    {input.options.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>

                                </select>
                            )}
                        </div>
                    ))}

                        onClick={handleSubmit}
                        className="bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"

                        Avançar
                    </button>

                            <div
                                key={option.value}

        // Componente para input de texto genérico (textarea ou input)
        const TextInputQuestion = ({ question, onAnswer, selectedResponse, showAlert, allResponses }) => {
            const [inputValue, setInputValue] = useState(selectedResponse || '');

            // Função para substituir placeholders como [@answer_to_question_id]
            const parseQuestionText = (text) => {
                return text.replace(/\[@answer_to_question_([a-zA-Z0-9_]+)\]/g, (match, questionId) => {
                    const response = allResponses[questionId];
                    if (response) {
                        // Se a resposta for um objeto (como em text_select_split), tente pegar um valor específico ou stringify
                        if (typeof response === 'object' && !Array.isArray(response)) {
                            // Ex: {funcao: 'Gerente', instituicao_tipo: 'clinica_imagem'}
                            if (questionId === 'info_inicial') {
                                return `${response.funcao} de ${questionsData.info_inicial.inputs[1].options.find(opt => opt.value === response.instituicao_tipo)?.label || response.instituicao_tipo}`;
                            }
                            // Tenta pegar o primeiro valor string do objeto
                            const firstStringValue = Object.values(response).find(val => typeof val === 'string');
                            return firstStringValue || JSON.stringify(response);
                        }
                        // Se for um array (multiple_choice_buttons), junte os labels
                        if (Array.isArray(response)) {
                            const qData = questionsData[questionId];
                            if (qData && qData.options) {
                                return response.map(val => qData.options.find(opt => opt.value === val)?.label || val).join(', ');
                            }
                            return response.join(', ');
                        }
                        return response;
                    }
                    return ''; // Retorna vazio se a resposta não for encontrada
                });
            };

            const handleSubmit = () => {
                if (!inputValue.trim()) {
                    showAlert('Por favor, preencha o campo.');
                    return;
                }
                onAnswer(question.id, inputValue);
            };

            return (

                            maxLength={question.inputProps.maxLength}
                            placeholder={question.inputProps.placeholder}
                        ></textarea>
                    ) : (
                        <input
                            type={question.inputProps.type || 'text'}
                            value={inputValue}
                            onChange={(e) => setInputValue(e.target.value)}

                            maxLength={question.inputProps.maxLength}
                            placeholder={question.inputProps.placeholder}

                        onClick={handleSubmit}

                        Avançar
                    </button>

        // Componente para múltiplas textareas curtas (como etapas de processo)
        const TextAreaMultiShortQuestion = ({ question, onAnswer, selectedResponse, showAlert }) => {
            const [inputs, setInputs] = useState(selectedResponse || Array(question.inputProps.length).fill(''));

            const handleChange = (index, value) => {
                const newInputs = [...inputs];
                newInputs[index] = value;
                setInputs(newInputs);
            };

            const handleSubmit = () => {
                if (inputs.some(input => !input.trim())) {
                    showAlert('Por favor, preencha todas as etapas.');

                }
                onAnswer(question.id, inputs);
            };

                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto">

                                value={inputs[index] || ''}
                                onChange={(e) => handleChange(index, e.target.value)}

                                maxLength={input.maxLength}
                                placeholder={input.placeholder}
                            ></textarea>
                        </div>
                    ))}

                        onClick={handleSubmit}

                        Avançar

                const newSelection = selectedOptions.includes(value)
                    ? selectedOptions.filter(item => item !== value)

                if (question.maxSelections && newSelection.length > question.maxSelections) {
                    showAlert(`Você pode selecionar no máximo ${question.maxSelections} opções.`);
                    return;
                }
                setSelectedOptions(newSelection);
            };

            const handleSubmit = () => {
                if (selectedOptions.length === 0 && !question.maxSelections) { // Allow 0 selections if maxSelections is not defined (single choice)
                    showAlert('Por favor, selecione pelo menos uma opção.');
                    return;
                }
                onAnswer(question.id, selectedOptions);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-3xl mx-auto text-center">

                        onClick={handleSubmit}
                        className="mt-8 bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                    >
                        Avançar

                    return;
                }
                onAnswer(question.id, localResponses);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary mb-6">{question.question}</h2>
                    {question.inputs.map(input => (
                        <div key={input.id} className="mb-6">
                            <label htmlFor={input.id} className="block text-gray-700 text-lg font-medium mb-2">{input.label}</label>
                            {input.type === 'number' && (
                                <input
                                    type="number"
                                    id={input.id}
                                    value={localResponses[input.id] || ''}
                                    onChange={(e) => handleChange(input.id, e.target.value)}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-1"
                                    placeholder={input.placeholder}
                                    min={input.min}
                                />
                            )}
                            {input.type === 'select' && (
                                <select
                                    id={input.id}
                                    value={localResponses[input.id] || ''}
                                    onChange={(e) => handleChange(input.id, e.target.value)}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-accent-1"
                                >
                                    <option value="">Selecione...</option>
                                    {input.options.map(opt => (
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    ))}
                                </select>
                            )}
                        </div>
                    ))}
                    <button
                        onClick={handleSubmit}
                        className="bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                    >
                        Avançar
                    </button>
                </div>
            );
        };

        // Componente para input numérico com select (para impacto financeiro)
        const NumberSelectQuestion = ({ question, onAnswer, selectedResponse, showAlert }) => {
            const [numberValue, setNumberValue] = useState(selectedResponse?.number || '');
            const [selectValue, setSelectValue] = useState(selectedResponse?.select || '');

            const handleSubmit = () => {
                if (!numberValue || !selectValue) {
                    showAlert('Por favor, preencha ambos os campos.');
                    return;
                }
                onAnswer(question.id, { number: numberValue, select: selectValue });
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary mb-6">{question.question}</h2>
                    <div className="mb-6">
                        <label htmlFor="numberInput" className="block text-gray-700 text-lg font-medium mb-2">Valor Estimado (R$):</label>
                        <input
                            type="number"
                            id="numberInput"
                            value={numberValue}
                            onChange={(e) => setNumberValue(e.target.value)}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-1"
                            placeholder={question.inputProps.placeholder}
                            min={question.inputProps.min}
                        />
                    </div>
                    <div className="mb-6">
                        <label htmlFor="selectInput" className="block text-gray-700 text-lg font-medium mb-2">Faixa de Impacto:</label>
                        <select
                            id="selectInput"
                            value={selectValue}
                            onChange={(e) => setSelectValue(e.target.value)}
                            className="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-accent-1"
                        >
                            <option value="">Selecione...</option>
                            {question.selectOptions.map(opt => (
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            ))}
                        </select>
                    </div>
                    <button
                        onClick={handleSubmit}
                        className="bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                    >
                        Avançar
                    </button>
                </div>
            );
        };

        // Componente para escala de opinião
        const OpinionScaleQuestion = ({ question, onAnswer, selectedResponse }) => {
            const [selectedOption, setSelectedOption] = useState(selectedResponse || null);

            const handleSubmit = (value) => {
                setSelectedOption(value);
                onAnswer(question.id, value);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto text-center">
                    <h2 className="text-2xl font-bold text-primary mb-8">{question.question}</h2>
                    <div className="flex flex-wrap justify-center gap-4">
                        {question.options.map(option => (
                            <button
                                key={option.value}
                                className={`py-3 px-6 rounded-full font-medium transition duration-300 border-2 ${
                                    selectedOption === option.value
                                        ? 'bg-accent-1 text-white border-accent-1 shadow-md'
                                        : 'bg-gray-100 text-primary border-gray-200 hover:bg-gray-200'
                                }`}
                                onClick={() => handleSubmit(option.value)}
                            >
                                {option.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // Componente para perguntas de sim/não ou checkbox simples
        const CheckboxQuestion = ({ question, onAnswer, selectedResponse, showAlert }) => {
            const [isChecked, setIsChecked] = useState(selectedResponse || false);

            const handleSubmit = () => {
                onAnswer(question.id, isChecked);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto text-center">
                    <h2 className="text-2xl font-bold text-primary mb-8">{question.question}</h2>
                    <label className="inline-flex items-center cursor-pointer">
                        <input
                            type="checkbox"
                            className="form-checkbox h-5 w-5 text-accent-1 rounded"
                            checked={isChecked}
                            onChange={(e) => setIsChecked(e.target.checked)}
                        />
                        <span className="ml-2 text-lg text-gray-700">{question.options[0].label}</span>
                    </label>
                    <button
                        onClick={handleSubmit}
                        className="mt-8 bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                    >
                        Avançar
                    </button>
                </div>
            );
        };

        // Componente para coletar e-mail
        const EmailInputQuestion = ({ question, onAnswer, selectedResponse, showAlert }) => {
            const [email, setEmail] = useState(selectedResponse || '');

            const handleSubmit = () => {
                if (!email.match(/^[^@\s]+@[^@\s]+\.[^@\s]+$/)) {
                    showAlert('Por favor, insira um e-mail válido.');
                    return;
                }
                onAnswer(question.id, email);
            };

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-primary mb-6">{question.question}</h2>
                    <input
                        type="email"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-1"
                        placeholder={question.inputProps.placeholder}
                    />
                    <button
                        onClick={handleSubmit}
                        className="mt-6 bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                    >
                        Avançar
                    </button>
                </div>
            );
        };

        // Componente para telas de agradecimento/upsell
        const ThankYouScreen = ({ question, responses, onRestart, db, userId, appId }) => {
            const messageText = typeof question.message === 'function' ? question.message(responses) : question.message;

            // Envia os dados para o Firestore ao montar o componente
            useEffect(() => {
                const saveDiagnosis = async () => {
                    if (db && userId) {
                        try {
                            await firebase.addDoc(firebase.collection(db, `artifacts/${appId}/users/${userId}/diagnosis_responses`), {
                                timestamp: new Date(),
                                responses: responses
                            });
                            console.log('Diagnóstico salvo no Firestore!');
                        } catch (e) {
                            console.error("Erro ao salvar diagnóstico no Firestore: ", e);
                        }
                    }
                };
                saveDiagnosis();
            }, [db, userId, appId, responses]);

            return (
                <div className="flex flex-col items-center justify-center min-h-[70vh] text-center p-8 bg-white rounded-xl shadow-lg max-w-4xl mx-auto">
                    <h1 className="text-4xl font-black text-primary mb-4">{question.title}</h1>
                    <p className="text-xl text-gray-700 mb-8 max-w-3xl">{messageText}</p>

                    {/* O bloco de upsell foi removido conforme solicitado. */}
                    <button
                        onClick={onRestart} // Botão para voltar ao início
                        className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full shadow-md transition duration-300 transform hover:scale-105 mt-4"
                    >
                        Voltar ao Início
                    </button>
                </div>
            );
        };

        // Componente para telas de statement/transição
        const StatementScreen = ({ question, onNext, responses }) => {
            const messageText = typeof question.message === 'function' ? question.message(responses) : question.message;
            const titleText = typeof question.title === 'function' ? question.title(responses) : question.title;
            return (
                <div className="flex flex-col items-center justify-center min-h-[50vh] text-center p-8 bg-white rounded-xl shadow-lg">
                    {titleText && <h1 className="text-3xl font-black text-primary mb-4">{titleText}</h1>}
                    <p className="text-xl text-gray-700 mb-8 max-w-2xl">{messageText}</p>
                    {question.cta && (
                        <button
                            onClick={onNext}
                            className="bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                        >
                            {question.cta}
                        </button>
                    )}
                </div>
            );
        };

        // Novo Componente para o Mini-Relatório da IA
        const AIMiniReportScreen = ({ question, onNext, responses }) => {
            const [reportData, setReportData] = useState(null);
            const [loadingReport, setLoadingReport] = useState(true);

            useEffect(() => {
                setLoadingReport(true);
                // Simulação da chamada à Gemini API (apenas simulação, sem chamada real para evitar complexidade de API key e custo)
                setTimeout(() => {
                    const selectedGargalo = responses.gargalo_critico;
                    let summary = "Sua análise detalhada revelou insights importantes.";
                    let financialImpact = "Não foi possível estimar o impacto financeiro com os dados fornecidos.";

                    if (selectedGargalo === 'agendamento') {
                        summary = "Seu processo de agendamento apresenta gargalos significativos, especialmente na confirmação e rastreamento de no-shows.";
                        financialImpact = "Estimamos uma perda de aproximadamente R$ 5.000 a R$ 15.000 ao mês devido a remarcações e faltas.";
                    } else if (selectedGargalo === 'faturamento') {
                        summary = "O faturamento da sua instituição está sofrendo com glosas e retrabalhos, impactando diretamente o fluxo de caixa.";
                        financialImpact = "Estimamos uma perda de aproximadamente R$ 8.000 a R$ 25.000 ao mês em receita não realizada devido a erros de faturamento.";
                    } else if (selectedGargalo === 'fluxo_pacientes') {
                        summary = "A lentidão no fluxo de pacientes está gerando insatisfação e ociosidade de recursos, desde a chegada até o atendimento final.";
                        financialImpact = "Estimamos uma perda de aproximadamente R$ 7.000 a R$ 20.000 ao mês devido à ineficiência no fluxo de pacientes.";
                    } else if (selectedGargalo === 'laudos') {
                        summary = "Atrasos na liberação de laudos e resultados estão comprometendo a agilidade do diagnóstico e a satisfação de pacientes e médicos.";
                        financialImpact = "Estimamos uma perda de aproximadamente R$ 6.000 a R$ 18.000 ao mês devido a laudos atrasados e retrabalho.";
                    } else if (selectedGargalo === 'equipe_resistente') {
                        summary = "A resistência da equipe à novas tecnologias e rotinas está freando a inovação e a produtividade na sua instituição.";
                        financialImpact = "O custo da não-adoção e do retrabalho pode chegar a R$ 4.000 a R$ 12.000 ao mês.";
                    } else if (selectedGargalo === 'estoque') {
                        summary = "A gestão ineficiente do estoque está resultando em perdas por vencimento, falta de insumos e custos operacionais elevados.";
                        financialImpact = "Estimamos uma perda de aproximadamente R$ 3.000 a R$ 10.000 ao mês devido a problemas de estoque.";
                    } else if (selectedGargalo === 'outro_gargalo') {
                        summary = `Sua descrição do desafio "${responses.outro_gargalo_detalhe}" foi clara. Nossa IA identificou pontos de atenção no seu processo.`;
                        financialImpact = "O impacto financeiro pode ser significativo, dependendo da escala do problema.";
                    }

                    setReportData({ summary, financialImpact });
                    setLoadingReport(false);
                }, 2500); // Simula um tempo de processamento da IA
            }, [responses]);

            return (
                <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl mx-auto text-center">
                    <h2 className="text-3xl font-black text-primary mb-6">{question.title}</h2>
                    {loadingReport ? (
                        <div className="flex flex-col items-center justify-center min-h-[20vh]">
                            <div className="loading-dots mb-4">
                                <span></span><span></span><span></span>
                            </div>
                            <p className="text-xl text-primary font-semibold">HealthFlow AI analisando seus dados...</p>
                        </div>
                    ) : (
                        <div className="fade-enter fade-enter-active">
                            <p className="text-xl text-gray-700 mb-6">{question.message(responses)}</p>
                            <div className="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
                                <p className="text-lg font-semibold text-blue-800">Impacto Financeiro Estimado:</p>
                                <p className="text-2xl font-bold text-blue-900 mt-2">{reportData.financialImpact}</p>
                            </div>
                            <button
                                onClick={() => onNext()}
                                className="bg-accent-1 hover:bg-accent-3 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105"
                            >
                                {question.cta}
                            </button>
                        </div>
                    )}
                </div>
            );
        };
        
        // Componente principal da aplicação
        const App = () => {
            const [currentQuestionId, setCurrentQuestionId] = useState('welcome');
            const [responses, setResponses] = useState({});
            const [feedbackMessage, setFeedbackMessage] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [history, setHistory] = useState([]); // Histórico de perguntas visitadas
            const [alertMessage, setAlertMessage] = useState(null); // Estado para o AlertDialog

            // Firebase states
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);

            const currentQuestion = questionsData[currentQuestionId];
            
            // Inicializa Firebase
            useEffect(() => {
                if (window.firebase && firebaseConfig && appId) {
                    try {
                        const app = window.firebase.initializeApp(firebaseConfig);
                        const firestore = window.firebase.getFirestore(app);
                        const firebaseAuth = window.firebase.getAuth(app);
                        setDb(firestore);
                        setAuth(firebaseAuth);

                        const unsubscribe = window.firebase.onAuthStateChanged(firebaseAuth, async (user) => {
                            if (user) {
                                setUserId(user.uid);
                                setIsAuthReady(true);
                                console.log("Firebase user authenticated:", user.uid);
                            } else {
                                console.log("No Firebase user, signing in anonymously...");
                                try {
                                    if (initialAuthToken) {
                                        await window.firebase.signInWithCustomToken(firebaseAuth, initialAuthToken);
                                        console.log("Signed in with custom token.");
                                    } else {
                                        await window.firebase.signInAnonymously(firebaseAuth);
                                        console.log("Signed in anonymously.");
                                    }
                                } catch (signInError) {
                                    console.error("Error during Firebase sign-in:", signInError);
                                    setAlertMessage("Falha ao fazer login. Por favor, tente novamente.");
                                }
                            }
                        });
                        return () => unsubscribe();
                    } catch (initError) {
                        console.error("Error initializing Firebase:", initError);
                        setAlertMessage("Falha ao inicializar o Firebase. Por favor, verifique sua configuração.");
                    }
                } else {
                    console.warn("Firebase or config not available. Running without data persistence.");
                }
            }, []);

            // Calcula o total de perguntas para a barra de progresso (aproximado)
            const totalQuestions = Object.keys(questionsData).length; // Isso é uma contagem linear, não de ramificação
            const currentQuestionIndex = Object.keys(questionsData).indexOf(currentQuestionId) + 1;
            
            // Ref para a rolagem
            const contentRef = useRef(null);
            
            // Efeito para rolar para o topo quando a pergunta muda
            useEffect(() => {
                if (contentRef.current) {
                    contentRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [currentQuestionId]);
            
            const handleAnswer = (questionId, answer) => {
                const updatedResponses = { ...responses, [questionId]: answer };
                setResponses(updatedResponses);
            
                // Adiciona a pergunta atual ao histórico ANTES de avançar
                setHistory(prevHistory => [...prevHistory, currentQuestionId]);
            
                let nextStepId;
                if (typeof currentQuestion.nextStep === 'function') {
                    nextStepId = currentQuestion.nextStep(updatedResponses);
                } else {
                    nextStepId = currentQuestion.nextStep;
                }
            
                // Processar feedback antes de avançar
                let feedback = null;
                if (currentQuestion.feedback) {
                    feedback = typeof currentQuestion.feedback === 'function'
                        ? currentQuestion.feedback(updatedResponses, answer)
                        : currentQuestion.feedback;
                }
                setFeedbackMessage(feedback);
            
                setIsLoading(true); // Simula IA pensando
                // Reduzindo o tempo de espera para um processamento mais rápido
                setTimeout(() => {
                    setIsLoading(false);
                    setFeedbackMessage(null); // Limpa o feedback para a próxima tela
                    setCurrentQuestionId(nextStepId);
                }, feedback ? 700 : 200); // Tempos de espera mais curtos
            };
            
            const handleGoBack = () => {
                if (history.length > 0) {
                    const previousQuestionId = history[history.length - 1];
                    setHistory(prevHistory => prevHistory.slice(0, -1)); // Remove o último item do histórico
                    setCurrentQuestionId(previousQuestionId);
                    setFeedbackMessage(null); // Limpa qualquer feedback ao voltar
                    setIsLoading(false); // Garante que não está em estado de loading
                }
            };

            const handleRestart = () => {
                setCurrentQuestionId('welcome');
                setResponses({});
                setHistory([]);
                setFeedbackMessage(null);
                setIsLoading(false);
            };

            const showAlert = (message) => {
                setAlertMessage(message);
            };

            const closeAlert = () => {
                setAlertMessage(null);
            };
            
            const renderQuestion = () => {
                if (isLoading) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-[50vh]">
                            <div className="loading-dots mb-4">
                                <span></span><span></span><span></span>
                            </div>
                            <p className="text-xl text-primary font-semibold">HealthFlow AI analisando seus dados...</p>
                        </div>
                    );
                }
            
                switch (currentQuestion.type) {
                    case 'welcome':
                        return <WelcomeScreen question={currentQuestion} onNext={() => handleAnswer(currentQuestion.id, true)} />;
                    case 'text_select_split':
                        return <TextSelectSplitQuestion question={currentQuestion} onAnswer={handleAnswer} responses={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'choice_cards':
                        return <ChoiceCardsQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'text_input':
                        return <TextInputQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} allResponses={responses} />;
                    case 'textarea_input': // Adicionado o case para textarea_input
                        return <TextInputQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} allResponses={responses} />;
                    case 'textarea_multi_short':
                        return <TextAreaMultiShortQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'multiple_choice_buttons':
                        return <MultipleChoiceButtons question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'number_select_split':
                        return <NumberSelectSplitQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'number_select':
                        return <NumberSelectQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'opinion_scale':
                        return <OpinionScaleQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'checkbox':
                        return <CheckboxQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'email_input':
                        return <EmailInputQuestion question={currentQuestion} onAnswer={handleAnswer} selectedResponse={responses[currentQuestion.id]} showAlert={showAlert} />;
                    case 'thank_you':
                        return <ThankYouScreen question={currentQuestion} responses={responses} onRestart={handleRestart} db={db} userId={userId} appId={appId} />;
                    case 'statement': // Adicionado o case para 'statement'
                        return <StatementScreen question={currentQuestion} onNext={() => handleAnswer(currentQuestion.id, true)} responses={responses} />;
                    case 'ai_mini_report': // Novo tipo de pergunta para o mini-relatório da IA
                        return <AIMiniReportScreen question={currentQuestion} onNext={() => handleAnswer(currentQuestion.id, true)} responses={responses} />;
                    default:
                        return <p className="text-red-500 text-center">Tipo de pergunta não reconhecido: {currentQuestion.type}</p>;
                }
            };
            
            return (
                <div className="min-h-screen flex flex-col items-center p-4 bg-f0f4f8 text-primary">
                    <AlertDialog message={alertMessage} onClose={closeAlert} /> {/* Adicionado o AlertDialog */}
                    <header className="w-full max-w-4xl text-center py-6">
                        <h1 className="text-3xl font-black text-primary">HealthFlow Pulse</h1>
                        <p className="text-lg text-gray-600 mt-2">Diagnóstico Inteligente de Processos em Saúde</p>
                    </header>
            
                    <main className="flex-grow w-full max-w-4xl flex items-center justify-center my-8" ref={contentRef}>
                        <div className="w-full">
                            {currentQuestion.id !== 'welcome' && currentQuestion.id !== 'thank_you_screen' && (
                                <ProgressBar
                                    currentStep={currentQuestionIndex}
                                    totalSteps={totalQuestions}
                                    currentPhaseLabel={currentQuestion.pathIndicator?.label}
                                    phaseStep={currentQuestion.pathIndicator?.step}
                                    totalPhaseSteps={currentQuestion.pathIndicator?.total}
                                />
                            )}
                            {renderQuestion()}
                            <FeedbackMessage message={feedbackMessage} />
                            {history.length > 0 && currentQuestion.type !== 'welcome' && currentQuestion.type !== 'thank_you' && (
                                <div className="text-center mt-8">
                                    <button
                                        onClick={handleGoBack}
                                        className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-full shadow-md transition duration-300 transform hover:scale-105"
                                    >
                                        ← Voltar
                                    </button>
                                </div>
                            )}
                        </div>
                    </main>
            
                    <footer className="w-full max-w-4xl text-center py-4 text-gray-500 text-sm">
                        © 2025 HealthFlow Revolution. Todos os direitos reservados.
                    </footer>
                </div>
            );
        };
        
        // Renderiza a aplicação React na div com id "root"
        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
